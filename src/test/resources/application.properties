spring.application.name=wallet-service-test

# Global service context root. The version segment comes from ApiVersions.V1 on each controller;
# together they must match the API constant used in the MockMvc tests.
wallet.api.base-path=/wallet-service

spring.datasource.url=jdbc:h2:mem:wallet_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Demo bearer tokens: token=userId
wallet.demo-tokens.tok-alice=alice
wallet.demo-tokens.tok-bob=bob
wallet.demo-tokens.tok-carol=carol

# Tests seed their own data
wallet.seed-demo-data=false
