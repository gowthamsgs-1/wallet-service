spring.application.name=wallet-service

# ---- API paths -----------------------------------------------------------
# Only the service context root is global; it is applied to every controller by ApiPathConfig
# and is also the security boundary enforced by BearerTokenFilter.
# The API version is declared per controller (ApiVersions.V1) so v1 and v2 can coexist.
# Effective URLs: /wallet-service/v1/wallets, /wallet-service/v1/transfers
wallet.api.base-path=/wallet-service
# Endpoints under the base path that need no bearer token (none today; deny-by-default).
# wallet.api.public-paths[0]=/wallet-service/v1/ping

# PostgreSQL DataSource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:wallet_db}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Demo bearer tokens: token=userId
wallet.demo-tokens.tok-alice=alice
wallet.demo-tokens.tok-bob=bob
wallet.demo-tokens.tok-carol=carol
spring.jackson.property-naming-strategy=SNAKE_CASE

# Structured (JSON) logging. Custom format: timestamp, level, correlation_id, then the
# domain-event key-values.
logging.structured.format.console=org.sgs.walletservice.logging.CorrelationIdJsonLogFormatter

# ---- Metrics -------------------------------------------------------------
# Actuator endpoints are served from the root, and the Prometheus scrape endpoint is
# mapped to /metrics (so: /metrics and /health rather than /actuator/...).
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoints.web.exposure.include=health,info,prometheus

# Publish a histogram for HTTP server timings so p99 latency can be computed,
# and tag every metric with the application name.
# Note: the meter name contains dots, so it must be bracketed to bind as one map key.
management.metrics.distribution.percentiles-histogram[http.server.requests]=true
management.metrics.distribution.percentiles[http.server.requests]=0.5,0.95,0.99
management.metrics.distribution.slo[http.server.requests]=50ms,100ms,250ms,500ms,1s
management.observations.key-values.application=wallet-service
